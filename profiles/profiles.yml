dataset_location_testbed:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      impersonate_service_account: "{{ env_var('DBT_IMPERSONATE_SERVICE_ACCOUNT') }}"
      project: "{{ env_var('DBT_PROJECT_ID') }}"
      execution_project: "{{ env_var('DBT_EXECUTION_PROJECT_ID') }}"
      dataset: "{{ env_var('DBT_DATASET_ID') }}"
      location: "{{ env_var('DBT_LOCATION', 'US') }}"
      threads: 1
      timeout_seconds: 300
      priority: interactive
